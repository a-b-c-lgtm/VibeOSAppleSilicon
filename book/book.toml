[book]
title = "Building a Hobby Operating System on Apple Silicon"
authors = ["The aarch64-osdev project"]
language = "en"
# Use the existing book/ tree in place: INDEX.md is the title page,
# chapters/ holds every part. SUMMARY.md is auto-generated by
# scripts/gen_book_summary.py from INDEX.md.
src = "."

[build]
# Keep mdbook's output outside book/ so the source tree (src = ".")
# never re-ingests its own rendered html on the next build.
build-dir = "../build/book-html"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/a-b-c-lgtm/VibeOSAppleSilicon"
edit-url-template = "https://github.com/a-b-c-lgtm/VibeOSAppleSilicon/edit/main/book/{path}"
no-section-label = true

[output.html.fold]
enable = true
level = 1

# Rewrites markdown links that escape book/ (i.e. point at source
# files in the repo) into absolute https://github.com/.../blob/...
# URLs, so the rendered html actually resolves the references.
# Run from the book root (the directory holding this book.toml), so
# the command path is relative to book/.
[preprocessor.github-links]
command = "./preprocessors/github_links.py"
owner = "a-b-c-lgtm"
repo = "VibeOSAppleSilicon"
branch = "main"
